<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating with TikTok - DreamStar Creator Studio</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f8f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 32px 40px; border-radius: 12px; border: 1px solid #e3e3e4; text-align: center; max-width: 460px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #eee; border-top-color: #fe2c55; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h3 style="margin:0 0 8px;">Connecting your TikTok Account...</h3>
    <p style="color:#73747b; font-size:14px; margin:0;" id="statusMsg">Completing OAuth 2.0 authorization with DreamStar Creator Studio.</p>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');

      if (error) {
        document.getElementById('statusMsg').textContent = 'Authorization failed: ' + error;
        return;
      }

      if (code) {
        sessionStorage.setItem('tiktok_auth_code', code);
        localStorage.setItem('tiktok_auth_code', code);
        sessionStorage.setItem('tiktok_connected', '1');

        // 로컬 토큰 교환 서버(127.0.0.1:5000)가 켜져 있으면 자동으로 code 전달하여 tokens.json 발급
        try {
          await fetch('http://127.0.0.1:5000/callback?code=' + encodeURIComponent(code), {
            mode: 'no-cors'
          });
        } catch (_) {}
      }

      setTimeout(() => {
        window.location.href = '../';
      }, 900);
    })();
  </script>
</body>
</html>
